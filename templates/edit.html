<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Patient – MIRA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container-fluid px-4">
    <span class="navbar-brand fw-bold fs-4">🏥 MIRA – Health Prediction System</span>
    <a href="/" class="btn btn-outline-light">← Back to List</a>
  </div>
</nav>

<div class="container mt-4" style="max-width: 650px;">
  <div class="card shadow">
    <div class="card-header bg-warning fw-bold">Edit Patient Record</div>
    <div class="card-body">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Full Name *</label>
          <input type="text" name="full_name" class="form-control" value="{{ patient.full_name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Date of Birth *</label>
          <input type="date" name="date_of_birth" class="form-control" value="{{ patient.date_of_birth }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address *</label>
          <input type="email" name="email" class="form-control" value="{{ patient.email }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Glucose (mg/dL) *</label>
          <input type="number" step="0.01" name="glucose" class="form-control" value="{{ patient.glucose }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Haemoglobin (g/dL) *</label>
          <input type="number" step="0.01" name="haemoglobin" class="form-control" value="{{ patient.haemoglobin }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Cholesterol (mg/dL) *</label>
          <input type="number" step="0.01" name="cholesterol" class="form-control" value="{{ patient.cholesterol }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Current AI Remarks</label>
          <textarea class="form-control" rows="3" readonly>{{ patient.remarks }}</textarea>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-warning btn-lg">
            💾 Update & Refresh AI Prediction
          </button>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
