<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Patient – MIRA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container-fluid px-4">
    <span class="navbar-brand fw-bold fs-4">🏥 MIRA – Health Prediction System</span>
    <a href="/" class="btn btn-outline-light">← Back to List</a>
  </div>
</nav>

<div class="container mt-4" style="max-width: 650px;">
  <div class="card shadow">
    <div class="card-header bg-success text-white fw-bold">Add New Patient</div>
    <div class="card-body">

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Full Name *</label>
          <input type="text" name="full_name" class="form-control" placeholder="e.g. John Smith" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Date of Birth *</label>
          <input type="date" name="date_of_birth" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address *</label>
          <input type="email" name="email" class="form-control" placeholder="e.g. john@email.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Glucose (mg/dL) *</label>
          <input type="number" step="0.01" name="glucose" class="form-control" placeholder="e.g. 95.5" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Haemoglobin (g/dL) *</label>
          <input type="number" step="0.01" name="haemoglobin" class="form-control" placeholder="e.g. 13.5" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Cholesterol (mg/dL) *</label>
          <input type="number" step="0.01" name="cholesterol" class="form-control" placeholder="e.g. 180.0" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-success btn-lg">
            🤖 Save & Get AI Prediction
          </button>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
